workflows:
  ios-pmndev-build:
    name: Build PMNDev TIPA
    instance_type: mac_mini_m1
    max_build_duration: 15
    environment:
      vars:
        THEOS: $CM_BUILD_DIR/theos
    scripts:
      - name: Setup Theos Toolchain & ldid
        script: |
          brew install ldid || true
          git clone --recursive https://github.com/theos/theos.git $THEOS
          curl -LO https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q master.zip
          mkdir -p $THEOS/sdks
          cp -R sdks-master/* $THEOS/sdks/ || true
      - name: Build TIPA Package
        script: |
          make clean
          make package FINALPACKAGE=1
          ldid -Sent.plist .theos/obj/PMNDev.app/PMNDev || ldid -Sent.plist .theos/obj/debug/PMNDev.app/PMNDev || true
          rm -rf Payload packages
          mkdir -p Payload packages
          cp -rp .theos/obj/PMNDev.app Payload/ || cp -rp .theos/obj/debug/PMNDev.app Payload/ || true
          zip -qr PMNDev.tipa Payload
          mv PMNDev.tipa packages/PMNDev.tipa
          rm -rf Payload
    artifacts:
      - "packages/*.tipa"

